<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Familiar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        [data-theme="dark"] .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Navigation Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-green-500 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-green-500/20">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900 dark:text-white">Gastos Compartilhados</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Sincronização em Tempo Real</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Sync Key Modal Button -->
                <button onclick="openSyncModal()" class="px-3 py-1.5 bg-green-50 dark:bg-green-950/40 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-800 rounded-lg text-xs font-semibold flex items-center gap-1.5 hover:bg-green-100 dark:hover:bg-green-900/50 transition">
                    <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                    <span id="sync-key-display">Sincronização</span>
                </button>

                <!-- Export CSV Button -->
                <button onclick="exportCSV()" title="Exportar para Excel/CSV" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition text-sm flex items-center gap-1.5 border border-slate-200 dark:border-slate-700">
                    <i class="fa-solid fa-file-excel text-green-600 text-xs"></i>
                    <span class="hidden sm:inline text-xs font-medium">CSV</span>
                </button>

                <!-- Dark Mode Toggle
